<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lao Looped 显示核对</title>
<style>
@font-face{font-family:"Lao Looped App";src:url("assets/fonts/NotoSansLaoLooped-Variable.woff2") format("woff2"),url("assets/fonts/NotoSansLaoLooped-Variable.ttf") format("truetype");font-weight:100 900;font-display:swap;unicode-range:U+0E80-0ECF,U+0EDC-0EFF}
body{font:16px/1.5 "Lao Looped App",system-ui,-apple-system,"PingFang SC","Noto Sans Lao",sans-serif;padding:20px;max-width:850px;margin:auto}p.sample{font-size:30px;line-height:1.8}input,textarea,button{font:inherit;max-width:100%;padding:8px}textarea{width:95%}.baseline{font-family:system-ui,-apple-system,"PingFang SC","Noto Sans Lao",sans-serif}
</style>
<h1>字体显示核对（不读取学习资料）</h1><p id="status">正在加载本地字体…</p>
<p class="sample">ກ ນ ໜ ຢ ຽ ເກີງ ນ້ຳ ໜູ</p>
<p class="sample" style="font-weight:700">ກ ນ ໜ ຢ ຽ ເກີງ ນ້ຳ ໜູ</p>
<p id="mixed">中文 English 0123456789 [ŋ nɔː kʰ aː] ໐໑໒</p>
<p class="baseline" id="baseline">中文 English 0123456789 [ŋ nɔː kʰ aː] ໐໑໒</p>
<p>上面两行非老挝字母内容应保持相同。</p>
<input value="ກ ນ ໜ ຢ ຽ ເກີງ ນ້ຳ ໜູ" aria-label="输入框字体核对">
<p><textarea aria-label="编辑区字体核对">中文 / ເກີງ ນ້ຳ ໜູ / [ŋ]</textarea></p>
<div id="dynamic"></div>
<script>
(async()=>{try{const faces=await document.fonts.load('30px "Lao Looped App"','ກນໜຢຽເກີງນ້ຳໜູ');if(!faces.length)throw Error('未加载');document.querySelector('#status').textContent='本地 Lao Looped 字体已加载。请检查带圈字形、上方附标及输入框。';document.querySelector('#dynamic').innerHTML='<button>动态按钮：ເກີງ ນ້ຳ ໜູ</button>';}catch(e){document.querySelector('#status').textContent='字体加载失败，当前使用回退字体：'+e.message;}})();
</script></html>
